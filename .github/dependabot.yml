# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: this file drives *version* updates only. Security updates are raised from
# Dependabot alerts and do not depend on it — which is why security PRs kept
# arriving while this file still carried an empty package-ecosystem.

version: 2
updates:
  # Frontend of the module itself (package.json + yarn.lock at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Patch/minor bumps of transitive deps arrive in bulk and each one rebases
    # the others' yarn.lock; one grouped PR per week keeps them mergeable.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # monaco-editor 0.53+ dropped ./esm/vs/editor/editor.worker.js from its exports
      # map, but monaco-worker-manager (pulled in by monaco-yaml) still imports that
      # exact path, so the webpack build fails with "no valid target file was found".
      # monaco-yaml 5.5.1 is the latest release and has not adapted yet, despite
      # advertising a permissive `monaco-editor >=0.36` peer range. Hold the 0.52 line
      # until monaco-yaml/monaco-worker-manager catch up, then remove this entry.
      # Without it, monaco-editor keeps breaking the whole grouped npm PR (see #50).
      - dependency-name: "monaco-editor"
        versions: [">=0.53.0"]

  # Cypress end-to-end suite, which has its own manifest.
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tests-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
