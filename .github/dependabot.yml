# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: this file drives *version* updates only. Security updates are raised from
# Dependabot alerts and do not depend on it — which is why security PRs kept
# arriving while this file still carried an empty package-ecosystem.

version: 2
updates:
  # Frontend of the module itself (package.json + yarn.lock at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Every bump here rewrites yarn.lock, so ungrouped PRs invalidate each other on
    # merge. Group them: minor/patch in one PR (routine), major in a second (needs a
    # real look). Two PRs per week instead of one per package.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # monaco-editor 0.53+ dropped ./esm/vs/editor/editor.worker.js from its exports
      # map, but monaco-worker-manager (pulled in by monaco-yaml) still imports that
      # exact path, so the webpack build fails with "no valid target file was found".
      # monaco-yaml 5.5.1 is the latest release and has not adapted yet, despite
      # advertising a permissive `monaco-editor >=0.36` peer range. Hold the 0.52 line
      # until monaco-yaml/monaco-worker-manager catch up, then remove this entry.
      # Without it, monaco-editor keeps breaking the whole grouped npm PR (see #50).
      - dependency-name: "monaco-editor"
        versions: [">=0.53.0"]

      # --- Provided by Jahia's app-shell as SHARED SINGLETONS ---
      # @jahia/webpack-config declares compatRanges react/react-dom = "16 - 18", and jcontent —
      # Jahia's own module for 8.2.3.2 — ships react ^18.3.1, i18next ^20.6.1,
      # react-i18next ^11.7.2 and @jahia/ui-extender ^1.1.1. The shell loads ONE instance of each
      # for every module, so asking for a version it does not provide breaks module federation at
      # load time, not at build time: CI stays green and the app fails in the browser. Raise these
      # only when the platform does.
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "i18next"
        versions: [">=21"]
      - dependency-name: "react-i18next"
        versions: [">=13"]
      - dependency-name: "@jahia/ui-extender"
        versions: [">=2"]

      # Coupled to the React version above: react-test-renderer must match React, and
      # @testing-library/react 13+ requires React 18+. Revisit both if React moves.
      - dependency-name: "react-test-renderer"
        versions: [">=17"]
      - dependency-name: "@testing-library/react"
        versions: [">=13"]

      # --- Held because the surrounding tooling cannot take them yet ---
      # TypeScript 7 is the native rewrite and changes the internal API ts-loader reads: the
      # webpack build dies with "Cannot read properties of undefined (reading 'fileExists')" in
      # ts-loader's findConfigFile. Lift when ts-loader supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7"]

      # ESLint 9 made flat config the default and 10 removed .eslintrc support entirely
      # ("ESLint couldn't find an eslint.config.* file"). This project lints with .eslintrc.json,
      # and @jahia/eslint-config still ships eslintrc-style rules. Lift once that config offers a
      # flat-config entry point and this repo migrates.
      - dependency-name: "eslint"
        versions: [">=9"]

      # eslint-plugin-react-hooks 7 adds set-state-in-effect, preserve-manual-memoization and refs.
      # They are legitimate and surface 7 real findings in Dialogs.jsx, CfgMetatypePropertyDialog,
      # MonacoEditor and useOsgiConfigs — worth a focused pass rather than being rushed through, or
      # silenced, inside a dependency bump.
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7"]

  # Cypress end-to-end suite, which has its own manifest.
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      tests-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      tests-npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # The ESLint toolchain here is pinned by @jahia/eslint-config 2.2.0, which *depends* on
      # eslint ^8.39.0 (not merely peers it) and fixes eslint-plugin-jest ^27, eslint-plugin-n
      # ^15||^16 and eslint-plugin-promise ^6. Verified: eslint 10 makes `yarn install` fail
      # outright with "could not find a copy of eslint to link", and eslint-plugin-cypress 7
      # exports a flat-config object that the eslintrc loader rejects ("Unexpected top-level
      # property name"). Lift the whole family together, once that config offers a flat-config
      # entry point and this repo migrates off .eslintrc.json.
      - dependency-name: "eslint"
        versions: [">=9"]
      - dependency-name: "eslint-plugin-cypress"
        versions: [">=3"]
      - dependency-name: "eslint-plugin-jest"
        versions: [">=28"]
      - dependency-name: "eslint-plugin-n"
        versions: [">=17"]
      - dependency-name: "eslint-plugin-prettier"
        versions: [">=5"]
      - dependency-name: "eslint-plugin-promise"
        versions: [">=7"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7"]

      # Same wall as the module: typescript-eslint refuses TS 7 outright — "typescript-eslint does
      # not support TS 7.0" — so linting the specs dies. TS 7 is the native rewrite; see
      # typescript-eslint#10940. Lift when that lands.
      #
      # NOT held, but a warning for whoever picks up the next tests-npm-major group: with the
      # Cypress-runtime majors applied (@cypress/webpack-preprocessor 8, babel-loader 10,
      # babel-plugin-istanbul 8, @cypress/code-coverage 4, cypress-multi-reporters 2, mocha 11,
      # mochawesome 8), the e2e suite HUNG — 21 minutes into a run that normally takes 10, still
      # inside "Provision and run Cypress", and killed by the 45-minute timeout (run 34093417898).
      # Install and lint were clean, so nothing local catches it. The culprit is not identified;
      # bisecting means one e2e run per candidate. Take that group one package at a time.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      maven-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
