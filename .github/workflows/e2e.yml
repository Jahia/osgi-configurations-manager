name: E2E

# The Cypress suite needs a running Jahia, so it is deliberately NOT part of the CI
# workflow: it is slower, and it needs a licence secret that forks cannot read.
on:
  workflow_dispatch:
  schedule:
    # Weekly, so a regression that only the browser catches cannot sit for a whole release.
    - cron: '0 3 * * 1'

jobs:
  e2e:
    name: Cypress
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Jahia boot plus provisioning plus the suite; well clear of the ~12 min observed locally.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '20.9.0'
          cache: yarn

      # The suite exercises the module through Jahia, so it needs the real bundle.
      - name: Build the module bundle
        run: mvn -B -ntp package -DskipTests

      - name: Stage the bundle for provisioning
        run: |
          mkdir -p tests/artifacts
          cp target/osgi-configurations-manager-*.jar tests/artifacts/

      # jahia-ee-dev is a private package — anonymous pull is refused (403). GITHUB_TOKEN
      # works if the package grants this repository access; set a GHCR_PULL_TOKEN secret
      # (a PAT with read:packages) to override it otherwise.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start Jahia
        working-directory: tests
        env:
          # Base64 of the licence XML. Without it Jahia refuses to boot.
          JAHIA_LICENSE: ${{ secrets.JAHIA_LICENSE }}
          JAHIA_IMAGE: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
          SUPER_USER_PASSWORD: root1234
        run: |
          if [ -z "$JAHIA_LICENSE" ]; then
            echo "::error::The JAHIA_LICENSE secret is not set. Add it in the repository settings (base64 of the licence XML)."
            exit 1
          fi
          # set-env.sh fills every compose variable (TESTS_IMAGE, MANIFEST, ...) from
          # .env.example. Compose validates the WHOLE project even when starting only the
          # jahia service, so the cypress service's image reference must be non-empty even
          # though that service is never started here.
          source ./set-env.sh
          docker compose up -d --renew-anon-volumes jahia

      # ci.startup.sh returns as soon as the container starts, so readiness has to be
      # waited for here — otherwise Cypress runs against a booting CMS and every login
      # times out.
      - name: Wait for Jahia
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://localhost:8080/cms/login || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "Jahia answered $code after ${i} attempt(s)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Jahia never became reachable"
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: yarn install --frozen-lockfile

      # env.run.sh provisions the staged bundle, asserts the module is actually installed,
      # then runs the suite. Going straight to `cypress run` skips the provisioning and
      # every spec then fails against a 404 app — worth knowing, it cost a while to spot.
      # Driving it through the project's own script keeps this workflow independent of
      # which binaries a given @jahia/cypress major exposes.
      - name: Provision and run Cypress
        working-directory: tests
        env:
          JAHIA_URL: http://localhost:8080
          JAHIA_PROCESSING_URL: http://localhost:8080
          SUPER_USER_PASSWORD: root1234
          MODULE_ID: osgi-configurations-manager
          MANIFEST: provisioning-manifest-snapshot.yml
        run: ./env.run.sh

      - name: Jahia log
        if: failure()
        working-directory: tests
        run: docker compose logs --tail 400 jahia

      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-results
          path: |
            tests/results/
          if-no-files-found: ignore
