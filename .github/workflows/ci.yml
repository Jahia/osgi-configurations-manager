name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 17 became usable once the jahia-modules parent moved to 8.2.3.2 (#77), which
      # brings a Lombok that no longer crashes the compiler with
      # "ExceptionInInitializerError: com.sun.tools.javac.code.TypeTag :: UNKNOWN".
      # maven-compiler-plugin still targets release 11, so the bytecode is unchanged.
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Matches <nodeVersion>/<yarnVersion> in pom.xml so the Jest run here and
      # the webpack build driven by frontend-maven-plugin agree.
      - uses: actions/setup-node@v7
        with:
          node-version: '20.9.0'
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Jest
        run: npx jest --ci

      # verify (not test) so the OSGi bundle packaging is exercised too.
      # This also runs the webpack build via frontend-maven-plugin.
      - name: Maven verify
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
