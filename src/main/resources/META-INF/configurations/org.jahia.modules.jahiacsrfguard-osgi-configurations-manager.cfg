# The React UI calls this action with fetch(), which Jahia's CSRFGuard token injection does not
# cover, so the endpoint is whitelisted here. CSRF protection is instead enforced by the action
# itself (OsgiConfigAction), which requires a custom X-Requested-With header that browsers cannot
# set on a cross-origin request without a (denied) CORS preflight.
whitelist = *.osgiConfigManager.do
