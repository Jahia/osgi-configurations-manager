services:
    jahia:
        image: '${JAHIA_IMAGE}'
        container_name: jahia
        ports:
            - '8080:8080'
            - '8000:8000'
        environment:
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_LICENSE=${JAHIA_LICENSE}
            - JPDA=true
            # Opt into the built-in (insecure) default encryption key so the E2E suite can exercise
            # the real encrypt/decrypt round-trip. Tomcat's catalina.sh appends CATALINA_OPTS to the
            # JVM, and the OSGi module runs in that JVM, so CryptoEngine.isDefaultKeyAllowed() sees it.
            # FOR TESTS ONLY — production must configure a real ...encryption.key (see SECURITY.md).
            - CATALINA_OPTS=-Dorg.jahia.modules.osgiconfigmanager.encryption.allowDefaultKey=true
        extra_hosts:
            - jahia:127.0.0.1
        networks:
            - stack
    # Cypress container
    cypress:
        image: '${TESTS_IMAGE}'
        # https://github.com/cypress-io/cypress/issues/350
        ipc: host
        container_name: cypress
        depends_on:
            - jahia
        environment:
            - MANIFEST=${MANIFEST}
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_URL=http://jahia:8080
            - NEXUS_USERNAME=${NEXUS_USERNAME}
            - NEXUS_PASSWORD=${NEXUS_PASSWORD}
        volumes:
            - ./results:/home/jahians/results
        networks:
            - stack
networks:
    stack:
